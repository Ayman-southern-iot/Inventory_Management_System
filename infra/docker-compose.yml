# Inventory Management System — production compose
# Deploy:  ./deploy.sh          (never run `docker compose down -v`)
name: ims

# Without a cap, Docker's json-file driver grows until the disk is full and takes the whole
# host down — a slow, boring, entirely avoidable outage (§3.3 non-negotiable #5). Applied to
# every service via the `*logging` alias.
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

services:
  db:
    <<: *logging
    # PIN THE MAJOR VERSION. `postgres:latest` will one day silently become
    # a new major and refuse to read your data directory.
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # keeps timestamps sane in pg_dump output
      TZ: Asia/Dhaka
    volumes:
      - pgdata:/var/lib/postgresql/data          # NAMED volume — survives everything
    # deliberately NOT published to the host; only the compose network can reach it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot. Runs to completion, then api starts. If a migration fails the api
  # never boots, so you can't end up serving traffic against a half-migrated DB.
  migrate:
    <<: *logging
    image: ${REGISTRY:-local}/ims-api:${IMS_TAG:-dev}
    # Lets a clean machine with no registry access run `docker compose up -d` and get a
    # working stack. A real deploy still uses `docker compose pull` against the registry.
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: "no"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Migrate, then seed. Without the seed step a fresh install comes up with an empty
    # database and no account to sign in with, so `docker compose up -d` produces a stack
    # nobody can use — which is not what §21.4 of the playbook promises. The seed is
    # idempotent (ON CONFLICT DO NOTHING), so running it on every start is safe and a
    # restart never resets a value an admin has since changed.
    command: ["sh", "-c", "npm run migration:run && npm run seed:run"]

  api:
    <<: *logging
    image: ${REGISTRY:-local}/ims-api:${IMS_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - files:/app/storage                       # generated BOM PDFs, uploads, letterhead
      # Read-only, and only so the monitoring check can stat the newest dump's mtime. Without
      # this the backup-freshness check reports "not configured" forever and a backup job that
      # quietly stopped looks exactly like a healthy system.
      - ./backups:/backups:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    <<: *logging
    image: ${REGISTRY:-local}/ims-web:${IMS_TAG:-dev}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # The stack's own reverse proxy: plain HTTP on the VM's LAN address, for the company's Nginx
  # Proxy Manager only. TLS ends at Cloudflare and NPM in front (RUNBOOK §0.7). Routing, the JSON
  # access log and the health endpoint are in nginx/ims.conf.template.
  # firewall/ims-docker-user.sh keeps every other source off the port. The published address and
  # port have no default: a stack that would bind somewhere unintended refuses to start instead.
  proxy:
    <<: *logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${IMS_LISTEN_IP:?set IMS_LISTEN_IP in infra/.env}:${IMS_HTTP_PORT:?set IMS_HTTP_PORT in infra/.env}:80"
    environment:
      IMS_PROXY_MAX_BODY: ${IMS_PROXY_MAX_BODY:-12m}
      IMS_PROXY_READ_TIMEOUT: ${IMS_PROXY_READ_TIMEOUT:-300s}
    volumes:
      - ./nginx/ims.conf.template:/etc/nginx/templates/default.conf.template:ro
      # On the host, so logrotate/ims-proxy can rotate it daily and keep 14 days.
      - ${IMS_PROXY_LOG_DIR:-/var/log/ims-proxy}:/var/log/ims-proxy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - web
      - api

volumes:
  pgdata:          # ← your database. Losing this is losing everything.
  files:           # ← generated PDFs
  # ims_caddy_data and ims_caddy_config stay on disk: the root stack still uses them, and it is the
  # rollback (RUNBOOK §0, step 8). Nothing here mounts them any more.
