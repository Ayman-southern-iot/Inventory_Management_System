<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Category Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F2F4F6;
    --pane: #FFFFFF;
    --pane-alt: #F8F9FB;
    --border: #DDE2E8;
    --border-strong: #C7CED7;
    --text: #1B222B;
    --text-muted: #626E7C;
    --text-faint: #97A1AD;
    --accent: #A85D2E;
    --accent-strong: #8B4A22;
    --accent-soft: rgba(168, 93, 46, 0.10);
    --success: #2F8F63;
    --success-soft: rgba(47, 143, 99, 0.12);
    --danger: #C43F2E;
    --danger-soft: rgba(196, 63, 46, 0.10);
    --focus: #2E7D8B;
    --guide: #D7DCE2;
    --shadow: 0 8px 24px rgba(20, 26, 33, 0.10);
    --radius: 8px;
    --sans: 'Manrope', system-ui, -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151A;
      --pane: #181C22;
      --pane-alt: #1D2229;
      --border: #2A313B;
      --border-strong: #38414D;
      --text: #E8ECF1;
      --text-muted: #8B95A3;
      --text-faint: #5B6472;
      --accent: #D08F5D;
      --accent-strong: #E3A874;
      --accent-soft: rgba(208, 143, 93, 0.14);
      --success: #6BC79A;
      --success-soft: rgba(107, 199, 154, 0.14);
      --danger: #E2695A;
      --danger-soft: rgba(226, 105, 90, 0.14);
      --focus: #6FC3D3;
      --guide: #2E353F;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151A;
    --pane: #181C22;
    --pane-alt: #1D2229;
    --border: #2A313B;
    --border-strong: #38414D;
    --text: #E8ECF1;
    --text-muted: #8B95A3;
    --text-faint: #5B6472;
    --accent: #D08F5D;
    --accent-strong: #E3A874;
    --accent-soft: rgba(208, 143, 93, 0.14);
    --success: #6BC79A;
    --success-soft: rgba(107, 199, 154, 0.14);
    --danger: #E2695A;
    --danger-soft: rgba(226, 105, 90, 0.14);
    --focus: #6FC3D3;
    --guide: #2E353F;
    --shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
  }

  * { box-sizing: border-box; }
  :root {
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input {
    font-family: inherit;
    color: inherit;
  }
  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
  }
  button:focus-visible { border-radius: 4px; }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
    max-width: 1180px;
    margin: 0 auto;
  }

  header {
    flex: none;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 20px;
    padding: 22px 28px 18px;
  }
  header h1 {
    font-size: 19px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 3px 0 0;
    font-size: 13px;
    color: var(--text-muted);
  }
  .search-wrap {
    position: relative;
    flex: none;
    width: 240px;
  }
  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    color: var(--text-faint);
    pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 8px 10px 8px 30px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--pane);
    color: var(--text);
    font-size: 13.5px;
  }
  #search::placeholder { color: var(--text-faint); }
  #search:focus-visible { outline-offset: 0; }

  .layout {
    flex: 1;
    display: flex;
    min-height: 0;
    padding: 0 28px 24px;
    gap: 18px;
  }

  .tree-pane {
    width: 380px;
    flex: none;
    background: var(--pane);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .tree-toolbar {
    flex: none;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .tree-scroll {
    overflow-y: auto;
    padding: 6px;
    flex: 1;
  }

  .tree-foot {
    flex: none;
    padding: 9px 14px;
    border-top: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--text-faint);
    font-family: var(--mono);
  }

  ul.tree, ul.tree ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .row {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding-right: 6px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text);
  }
  .row:hover { background: var(--pane-alt); }
  .row.selected { background: var(--accent-soft); }
  .row.selected .row-name { color: var(--accent-strong); font-weight: 600; }
  .row.inactive .row-name { color: var(--text-faint); }
  .row.inactive .count { color: var(--text-faint); }

  .indent { flex: none; height: 100%; }
  .guide-cell {
    flex: none;
    width: 24px;
    height: 100%;
    position: relative;
  }
  .guide-cell::before {
    content: "";
    position: absolute;
    left: 11px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--guide);
  }
  .guide-cell::after {
    content: "";
    position: absolute;
    left: 11px;
    top: 50%;
    width: 9px;
    height: 1px;
    background: var(--guide);
  }
  .guide-cell.last::before { bottom: 50%; }
  /* pass-through column for an ancestor level: vertical line only, no elbow */
  .guide-cell.pass::after { display: none; }

  .chevron-slot {
    flex: none;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 5px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
  }
  .chevron-slot:hover { background: var(--border); }
  .chevron-slot svg {
    width: 11px;
    height: 11px;
    transition: transform 0.14s ease;
  }
  .row[data-expanded="true"] .chevron-slot svg { transform: rotate(90deg); }

  .status-dot {
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--success);
  }
  .row.inactive .status-dot { background: var(--text-faint); }

  .row-name {
    flex: 1;
    min-width: 0;
    font-size: 13.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row-name mark {
    background: var(--accent-soft);
    color: inherit;
    border-radius: 3px;
    padding: 0 1px;
  }

  .count {
    flex: none;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-faint);
  }

  .add-btn {
    flex: none;
    width: 22px;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 5px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    opacity: 0.35;
    cursor: pointer;
    transition: opacity 0.12s ease, background 0.12s ease;
  }
  .row:hover .add-btn,
  .add-btn:hover,
  .add-btn:focus-visible {
    opacity: 1;
  }
  .add-btn:hover { background: var(--border); }
  .add-btn:disabled {
    opacity: 0.15;
    cursor: not-allowed;
  }
  .add-btn svg { width: 13px; height: 13px; }

  /* inline add / rename input row */
  .inline-input-row {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 34px;
    padding-right: 6px;
  }
  .inline-input-row input {
    flex: 1;
    min-width: 0;
    height: 26px;
    padding: 0 8px;
    border-radius: 5px;
    border: 1px solid var(--focus);
    background: var(--pane);
    font-size: 13px;
  }
  .inline-error {
    padding: 2px 0 6px;
    font-size: 11.5px;
    color: var(--danger);
  }

  .empty-search {
    padding: 28px 16px;
    text-align: center;
    color: var(--text-faint);
    font-size: 13px;
  }

  /* ---- detail pane ---- */
  .detail-pane {
    flex: 1;
    min-width: 0;
    background: var(--pane);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow-y: auto;
  }

  .empty-state {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 6px;
    padding: 40px;
    text-align: center;
  }
  .empty-state .icon {
    width: 34px;
    height: 34px;
    color: var(--text-faint);
    margin-bottom: 6px;
  }
  .empty-state h2 {
    font-size: 14.5px;
    margin: 0;
    color: var(--text-muted);
    font-weight: 600;
  }
  .empty-state p {
    margin: 0;
    font-size: 13px;
    color: var(--text-faint);
    max-width: 280px;
    line-height: 1.5;
  }

  .detail-inner { padding: 24px 28px 32px; }

  .back-link {
    display: none;
    align-items: center;
    gap: 5px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    padding: 4px 0;
    margin-bottom: 14px;
    cursor: pointer;
  }
  .back-link svg { width: 13px; height: 13px; }

  .crumb {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-faint);
    margin-bottom: 10px;
    word-break: break-word;
  }
  .crumb span:last-child { color: var(--text-muted); }

  .name-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .name-row h2 {
    font-size: 21px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .rename-btn {
    flex: none;
    background: none;
    border: none;
    color: var(--text-faint);
    cursor: pointer;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rename-btn:hover { background: var(--pane-alt); color: var(--text-muted); }
  .rename-btn svg { width: 14px; height: 14px; }
  .rename-input-wrap { margin-bottom: 4px; }
  .rename-input-wrap input {
    font-size: 21px;
    font-weight: 700;
    font-family: var(--sans);
    padding: 4px 8px;
    border-radius: 6px;
    border: 1px solid var(--focus);
    background: var(--pane);
    width: 100%;
    max-width: 420px;
  }

  .status-line {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 22px;
  }
  .status-line .status-dot { width: 7px; height: 7px; }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 7px;
    overflow: hidden;
    margin-bottom: 24px;
  }
  .stat {
    background: var(--pane);
    padding: 12px 14px;
  }
  .stat .label {
    font-size: 11px;
    color: var(--text-faint);
    margin-bottom: 3px;
  }
  .stat .value {
    font-family: var(--mono);
    font-size: 16px;
    font-weight: 500;
  }

  .field-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 0;
    border-top: 1px solid var(--border);
  }
  .field-row:last-child { border-bottom: 1px solid var(--border); }
  .field-label { font-size: 13.5px; }
  .field-sub { font-size: 12px; color: var(--text-faint); margin-top: 2px; }

  .switch {
    position: relative;
    width: 36px;
    height: 21px;
    flex: none;
    border-radius: 999px;
    border: none;
    background: var(--border-strong);
    cursor: pointer;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: var(--pane);
    transition: transform 0.14s ease;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .switch[aria-checked="true"] { background: var(--success); }
  .switch[aria-checked="true"]::after { transform: translateX(15px); }

  .add-child-row {
    padding: 16px 0;
    border-top: 1px solid var(--border);
  }
  .add-child-row .field-label { margin-bottom: 8px; }
  .add-inline {
    display: flex;
    gap: 8px;
  }
  .add-inline input {
    flex: 1;
    min-width: 0;
    height: 32px;
    padding: 0 10px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--pane-alt);
    font-size: 13px;
  }
  .add-inline input:focus-visible { border-color: var(--focus); }
  .btn {
    height: 32px;
    padding: 0 14px;
    border-radius: 6px;
    border: 1px solid var(--border-strong);
    background: var(--pane);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn:hover { background: var(--pane-alt); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .btn-primary:hover { background: var(--accent-strong); }
  .btn-with-icon {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 0 13px 0 10px;
  }
  .btn-with-icon svg { width: 13px; height: 13px; color: var(--accent); }
  .empty-state .btn { margin-top: 12px; }
  .depth-note {
    font-size: 12px;
    color: var(--text-faint);
    padding: 14px 0;
    border-top: 1px solid var(--border);
  }

  .danger-zone {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .danger-zone .field-label { color: var(--text-muted); margin-bottom: 10px; }
  .btn-danger {
    background: none;
    border: 1px solid var(--danger);
    color: var(--danger);
  }
  .btn-danger:hover { background: var(--danger-soft); }
  .btn-restore {
    background: none;
    border: 1px solid var(--success);
    color: var(--success);
  }
  .btn-restore:hover { background: var(--success-soft); }

  .warn-box {
    margin-top: 12px;
    padding: 13px 14px;
    border-radius: 7px;
    border: 1px solid var(--danger);
    background: var(--danger-soft);
  }
  .warn-box p {
    margin: 0 0 10px;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--text);
  }
  .warn-box .actions { display: flex; gap: 8px; }

  .activity {
    margin-top: 26px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .activity .field-label { color: var(--text-muted); margin-bottom: 10px; }
  .activity-row {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    padding: 5px 0;
    color: var(--text-muted);
  }
  .activity-row span:last-child { font-family: var(--mono); color: var(--text-faint); }
  .activity-note {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-faint);
    line-height: 1.5;
  }

  @media (max-width: 760px) {
    header { padding: 16px 16px 12px; flex-direction: column; align-items: stretch; }
    .search-wrap { width: 100%; }
    .layout { padding: 0 16px 16px; }
    .tree-pane { width: 100%; }
    .detail-inner { padding: 18px 18px 28px; }
    .layout.detail-open .tree-pane { display: none; }
    .layout:not(.detail-open) .detail-pane { display: none; }
    .back-link { display: flex; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Category tree</h1>
      <p>Southern IoT &middot; Electronics &amp; hardware inventory</p>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Filter categories" autocomplete="off">
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="tree-pane">
      <div class="tree-toolbar">
        <button type="button" class="btn btn-with-icon" id="addRootBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          Add top-level category
        </button>
      </div>
      <div class="tree-scroll">
        <ul class="tree" id="tree" role="tree" aria-label="Category tree"></ul>
      </div>
      <div class="tree-foot" id="treeFoot"></div>
    </aside>

    <section class="detail-pane" id="detailPane"></section>
  </div>
</div>

        { id: "enclosures", name: "Enclosures", trackable: false, status: "active", count: 33, createdAt: "Mar 2024", updatedAt: "4 months ago" }
      ]}
    ]},
    { id: "machines", name: "Machines & Equipment", trackable: true, status: "active", createdAt: "Mar 2024", updatedAt: "6 months ago", children: [
      { id: "cnc", name: "CNC", trackable: true, status: "active", count: 6, createdAt: "Mar 2024", updatedAt: "6 months ago" },
      { id: "printers-3d", name: "3D Printers", trackable: true, status: "active", count: 4, createdAt: "Mar 2024", updatedAt: "6 months ago" }
    ]},
    { id: "consumables", name: "Consumables & Misc", trackable: true, status: "active", createdAt: "Mar 2024", updatedAt: "2 weeks ago", children: [
      { id: "wires", name: "Wires & Heat Shrink", trackable: true, status: "active", count: 88, createdAt: "Mar 2024", updatedAt: "2 weeks ago" },
      { id: "batteries", name: "Batteries & Power Supplies", trackable: true, status: "active", count: 27, createdAt: "Mar 2024", updatedAt: "3 weeks ago" }
    ]}
  ];

  var MAX_DEPTH = 3;
  var ROOT = "__root__"; // addingParentId value for "new top-level category"

  var state = {
    expanded: new Set(["electronics"]),
    selectedId: null,
    query: "",
    addingParentId: null,
    inlineAddError: null,
    inlineAddDraft: "",
    detailAddError: null,
    detailAddDraft: "",
    renamingId: null,
    renameError: null,
    confirmDeactivateId: null
  };

  var byId = {};
  var parentOf = {};
  (function index(nodes, parent) {
    nodes.forEach(function (n) {
      byId[n.id] = n;
      parentOf[n.id] = parent ? parent.id : null;
      if (n.children) index(n.children, n);
    });
  })(DATA, null);

  function siblingsOf(id) {
    var pid = parentOf[id];
    return pid ? byId[pid].children : DATA;
  }
  function pathOf(id) {
    var path = [];
    var cur = id;
    while (cur) { path.unshift(byId[cur]); cur = parentOf[cur]; }
    return path;
  }
  function depthOf(id) { return pathOf(id).length; }
  function hasChildren(n) { return !!(n.children && n.children.length); }

  function leafCount(n) {
    var own = typeof n.count === "number" ? n.count : 0;
    if (!hasChildren(n)) return own;
    return own + n.children.reduce(function (sum, c) { return sum + leafCount(c); }, 0);
  }
  function activeDescendantStats(n) {
    var cats = 0, items = 0;
    (function walk(node) {
      if (node.children) {
        node.children.forEach(function (c) {
          if (c.status === "active") {
            cats += 1;
            items += leafCount(c);
          }
          walk(c);
        });
      }
    })(n);
    return { cats: cats, items: items };
  }

  function matchesQuery(n, q) {
    return n.name.toLowerCase().indexOf(q) !== -1;
  }
  function subtreeMatches(n, q) {
    if (matchesQuery(n, q)) return true;
    if (n.children) return n.children.some(function (c) { return subtreeMatches(c, q); });
    return false;
  }

  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function highlight(name, q) {
    if (!q) return esc(name);
    var lower = name.toLowerCase();
    var idx = lower.indexOf(q);
    if (idx === -1) return esc(name);
    return esc(name.slice(0, idx)) + "<mark>" + esc(name.slice(idx, idx + q.length)) + "</mark>" + esc(name.slice(idx + q.length));
  }

  var chevronSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  var plusSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

  var treeEl = document.getElementById("tree");
  var searchEl = document.getElementById("search");
  var layoutEl = document.getElementById("layout");
  var detailEl = document.getElementById("detailPane");
  var treeFootEl = document.getElementById("treeFoot");

  function render() {
    renderTree();
    renderDetail();
  }

  function renderTree() {
    var q = state.query.trim().toLowerCase();
    var html = [];
    var visibleTotal = 0;

    function renderList(nodes, depth, ancestorLines) {
      var visible = nodes.filter(function (n) { return !q || subtreeMatches(n, q); });
      visible.forEach(function (n, i) {
        var isLast = i === visible.length - 1;
        visibleTotal++;
        html.push(renderNode(n, depth, ancestorLines, isLast, q));
        var expanded = q ? subtreeMatches(n, q) : state.expanded.has(n.id);
        if (hasChildren(n) && expanded) {
          if (state.addingParentId === n.id) {
            html.push(renderInlineAdd(n, depth + 1, ancestorLines.concat(!isLast)));
          }
          renderList(n.children, depth + 1, ancestorLines.concat(!isLast));
        } else if (state.addingParentId === n.id) {
          html.push(renderInlineAdd(n, depth + 1, ancestorLines.concat(!isLast)));
        }
      });
    }
    renderList(DATA, 0, []);
    if (state.addingParentId === ROOT) html.push(renderRootAdd());

    if (!html.length) {
      treeEl.innerHTML = '<li class="empty-search">No categories match &ldquo;' + esc(state.query) + '&rdquo;</li>';
    } else {
      treeEl.innerHTML = html.join("");
    }

    treeFootEl.textContent = visibleTotal + (q ? " match" + (visibleTotal === 1 ? "" : "es") : " categories");
  }

  // One column per ancestor below the top level. Top-level rows have no connector, so they get no column.
  function renderGuides(ancestorLines) {
    return ancestorLines.slice(1).map(function (hasMore) {
      return '<span class="guide-cell pass"' + (hasMore ? "" : ' style="visibility:hidden"') + '></span>';
    }).join("");
  }

  function renderNode(n, depth, ancestorLines, isLast, q) {
    var expanded = q ? subtreeMatches(n, q) : state.expanded.has(n.id);
    var children = hasChildren(n);
    var selected = state.selectedId === n.id;
    var inactive = n.status === "inactive";
    var count = leafCount(n);
    var atMaxDepth = depth + 1 >= MAX_DEPTH; // depth is 0-indexed; row itself sits at depth+1

    var guides = ancestorLines.length ? renderGuides(ancestorLines) : "";
    var selfGuide = depth > 0
      ? '<span class="guide-cell' + (isLast ? " last" : "") + '"></span>'
      : "";

    var chevron = children
      ? '<button type="button" class="chevron-slot" data-action="toggle" data-id="' + n.id + '" aria-label="' + (expanded ? "Collapse " : "Expand ") + esc(n.name) + '">' + chevronSVG + "</button>"
      : '<span class="chevron-slot" aria-hidden="true"></span>';

    var addDisabled = atMaxDepth;
    var addBtn = '<button type="button" class="add-btn" data-action="add" data-id="' + n.id + '" ' +
      (addDisabled ? 'disabled title="Categories are capped at 3 levels deep"' : ('title="Add subcategory to ' + esc(n.name) + '"')) +
      ' aria-label="Add subcategory to ' + esc(n.name) + '">' + plusSVG + "</button>";

    return '<li role="none">' +
      '<div class="row' + (selected ? " selected" : "") + (inactive ? " inactive" : "") + '" ' +
        'role="treeitem" tabindex="0" data-id="' + n.id + '" data-has-children="' + children + '" data-expanded="' + expanded + '" ' +
        'aria-selected="' + selected + '"' + (children ? ' aria-expanded="' + expanded + '"' : "") + ' aria-level="' + (depth + 1) + '">' +
        guides + selfGuide + chevron +
        '<span class="status-dot" aria-hidden="true"></span>' +
        '<span class="row-name">' + highlight(n.name, q) + "</span>" +
        '<span class="count">' + count + "</span>" +
        addBtn +
      "</div>" +
    "</li>";
  }

  function renderInlineAdd(parent, depth, ancestorLines) {
    var guides = ancestorLines.length ? renderGuides(ancestorLines) : "";
    var selfGuide = depth > 0 ? '<span class="guide-cell last"></span>' : "";
    return '<li role="none">' +
      '<div class="inline-input-row" style="padding-left:0">' +
        guides + selfGuide +
        '<span class="chevron-slot" aria-hidden="true"></span>' +
        '<input type="text" id="inlineAddInput" placeholder="Subcategory name" ' +
          'aria-label="New subcategory name" data-parent="' + parent.id + '" value="' + esc(state.inlineAddDraft || "") + '">' +
      "</div>" +
      '<div class="inline-error" id="inlineAddError" role="alert" style="display:' + (state.inlineAddError ? "block" : "none") + '; padding-left:' + (depth * 30 + 28) + 'px">' + (state.inlineAddError ? esc(state.inlineAddError) : "") + "</div>" +
    "</li>";
  }

  function renderRootAdd() {
    return '<li role="none">' +
      '<div class="inline-input-row">' +
        '<span class="chevron-slot" aria-hidden="true"></span>' +
        '<input type="text" id="inlineAddInput" placeholder="Top-level category name" ' +
          'aria-label="New top-level category name" data-parent="' + ROOT + '" value="' + esc(state.inlineAddDraft || "") + '">' +
      "</div>" +
      '<div class="inline-error" id="inlineAddError" role="alert" style="display:' + (state.inlineAddError ? "block" : "none") + '; padding-left:28px">' + (state.inlineAddError ? esc(state.inlineAddError) : "") + "</div>" +
    "</li>";
  }

  function renderDetail() {
    var n = state.selectedId ? byId[state.selectedId] : null;
    if (!n) {
      detailEl.innerHTML =
        '<div class="empty-state">' +
          '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>' +
          "<h2>No category selected</h2>" +
          "<p>Choose one from the tree to see its details, or use the plus button on any row to add a subcategory.</p>" +
          '<button type="button" class="btn btn-with-icon" data-action="add-root">' + plusSVG + " Add top-level category</button>" +
        "</div>";
      layoutEl.classList.remove("detail-open");
      return;
    }
    layoutEl.classList.add("detail-open");

    var path = pathOf(n.id);
    var crumb = path.map(function (p, i) {
      return '<span>' + esc(p.name) + "</span>" + (i < path.length - 1 ? " / " : "");
    }).join("");

    var children = hasChildren(n);
    var depth = path.length;
    var atMaxDepth = depth >= MAX_DEPTH;
    var count = leafCount(n);
    var inactive = n.status === "inactive";

    var nameBlock = state.renamingId === n.id
      ? '<div class="rename-input-wrap"><input type="text" id="renameInput" value="' + esc(n.name) + '" aria-label="Rename category"></div>' +
        '<div class="inline-error" id="renameError" style="display:' + (state.renameError ? "block" : "none") + '">' + (state.renameError ? esc(state.renameError) : "") + "</div>"
      : '<div class="name-row"><h2>' + esc(n.name) + '</h2>' +
        '<button type="button" class="rename-btn" data-action="rename" aria-label="Rename ' + esc(n.name) + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>' +
        "</button></div>";

    var statGrid = children
      ? '<div class="stat-grid">' +
          '<div class="stat"><div class="label">Subcategories</div><div class="value">' + n.children.length + '</div></div>' +
          '<div class="stat"><div class="label">Items tracked below</div><div class="value">' + count + '</div></div>' +
        "</div>"
      : '<div class="stat-grid">' +
          '<div class="stat"><div class="label">Items in stock</div><div class="value">' + count + '</div></div>' +
          '<div class="stat"><div class="label">Depth</div><div class="value">' + depth + " / " + MAX_DEPTH + '</div></div>' +
        "</div>";

    var addSection = atMaxDepth
      ? '<div class="depth-note">Categories are capped at ' + MAX_DEPTH + ' levels deep &mdash; ' + esc(n.name) + " can't have subcategories.</div>"
      : '<div class="add-child-row">' +
          '<div class="field-label">Add subcategory</div>' +
          '<div class="add-inline">' +
            '<input type="text" id="detailAddInput" placeholder="e.g. Laser Modules" aria-label="New subcategory name" value="' + esc(state.detailAddDraft || "") + '">' +
            '<button type="button" class="btn btn-primary" data-action="detail-add">Add</button>' +
          "</div>" +
          '<div class="inline-error" id="detailAddError" role="alert" style="display:' + (state.detailAddError ? "block" : "none") + '">' + (state.detailAddError ? esc(state.detailAddError) : "") + "</div>" +
        "</div>";

    var stats = activeDescendantStats(n);
    var warnBox = "";
    var deactivateBtn = "";
    if (state.confirmDeactivateId === n.id) {
      warnBox = '<div class="warn-box">' +
        '<p>Deactivating <strong>' + esc(n.name) + "</strong> will also affect <strong>" + stats.cats + " active subcategor" + (stats.cats === 1 ? "y" : "ies") + "</strong> and roughly <strong>" + stats.items + " items</strong> tracked beneath it. Southern IoT hasn&rsquo;t decided yet whether deactivating a parent should cascade to its children &mdash; for now this only marks <strong>" + esc(n.name) + "</strong> itself as inactive, and everything beneath it stays exactly as it is.</p>" +
        '<div class="actions">' +
          '<button type="button" class="btn btn-danger" data-action="confirm-deactivate">Deactivate just this category</button>' +
          '<button type="button" class="btn" data-action="cancel-deactivate">Cancel</button>' +
        "</div>" +
      "</div>";
    }
    if (inactive) {
      deactivateBtn = '<button type="button" class="btn btn-restore" data-action="reactivate">Reactivate</button>';
    } else {
      deactivateBtn = '<button type="button" class="btn btn-danger" data-action="deactivate">Deactivate</button>' + warnBox;
    }

    detailEl.innerHTML =
      '<div class="detail-inner">' +
        '<button type="button" class="back-link" data-action="back">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg> Back to tree' +
        "</button>" +
        '<div class="crumb">' + crumb + "</div>" +
        nameBlock +
        '<div class="status-line"><span class="status-dot" style="background:' + (inactive ? "var(--text-faint)" : "var(--success)") + '"></span>' + (inactive ? "Inactive" : "Active") + "</div>" +
        statGrid +
        '<div class="field-row"><div><div class="field-label">Track stock for items in this category</div><div class="field-sub">Turn off for categories you don&rsquo;t count unit-by-unit.</div></div>' +
          '<button type="button" class="switch" role="switch" aria-checked="' + !!n.trackable + '" data-action="toggle-trackable" aria-label="Track stock"></button>' +
        "</div>" +
        addSection +
        '<div class="danger-zone"><div class="field-label">' + (inactive ? "This category is inactive" : "Danger zone") + '</div>' + deactivateBtn + "</div>" +
        '<div class="activity"><div class="field-label">Activity</div>' +
          '<div class="activity-row"><span>Added</span><span>' + esc(n.createdAt) + "</span></div>" +
          '<div class="activity-row"><span>Last changed</span><span>' + esc(n.updatedAt) + "</span></div>" +
          '<div class="activity-note">Full change history (who changed what, and when) is coming with the audit trail &mdash; this panel is where it will live.</div>' +
        "</div>" +
      "</div>";

    var addInput = document.getElementById("detailAddInput");
    if (addInput) {
      addInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") submitDetailAdd(n.id, addInput.value);
      });
      addInput.addEventListener("input", function () {
        state.detailAddDraft = addInput.value;
        if (state.detailAddError) {
          state.detailAddError = null;
          var er = document.getElementById("detailAddError");
          if (er) er.style.display = "none";
        }
      });
    }
    var renameInput = document.getElementById("renameInput");
    if (renameInput) {
      renameInput.focus();
      renameInput.select();
      renameInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter") submitRename(n.id, renameInput.value);
        if (e.key === "Escape") { state.renamingId = null; state.renameError = null; renderDetail(); }
      });
      renameInput.addEventListener("blur", function () {
        if (state.renamingId === n.id) submitRename(n.id, renameInput.value);
      });
    }
  }

  // ---- mutation helpers ----
  function nameCollides(name, siblings, excludeId) {
    var lower = name.trim().toLowerCase();
    return siblings.some(function (s) { return s.id !== excludeId && s.name.trim().toLowerCase() === lower; });
  }

  // Shared by the tree's inline add and the detail pane. parentId === ROOT creates a top-level category.
  function createCategory(parentId, name) {
    var isRoot = parentId === ROOT;
    var parent = isRoot ? null : byId[parentId];
    var siblings = isRoot ? DATA : (parent.children || []);
    if (nameCollides(name, siblings, null)) {
      return { error: '"' + name + '" already exists ' + (isRoot ? "at the top level." : "under " + parent.name + ".") };
    }
    var id = slugify(name, siblings);
    var node = { id: id, name: name, trackable: true, status: "active", count: 0, createdAt: "Today", updatedAt: "Today" };
    if (isRoot) {
      DATA.push(node);
      parentOf[id] = null;
    } else {
      if (!parent.children) parent.children = [];
      parent.children.push(node);
      parentOf[id] = parent.id;
      state.expanded.add(parentId);
    }
    byId[id] = node;
    // A filter that hides the new category would make the add look like it failed.
    if (state.query) { state.query = ""; searchEl.value = ""; }
    return { node: node };
  }

  function cancelInlineAdd() {
    state.addingParentId = null;
    state.inlineAddError = null;
    state.inlineAddDraft = "";
    renderTree();
  }

  function startRootAdd() {
    if (state.addingParentId === ROOT) { focusInlineAdd(); return; }
    if (state.query) { state.query = ""; searchEl.value = ""; }
    state.addingParentId = ROOT;
    state.inlineAddError = null;
    state.inlineAddDraft = "";
    renderTree();
    focusInlineAdd();
  }

  function submitInlineAdd(parentId, rawName) {
    var name = rawName.trim();
    if (!name) { cancelInlineAdd(); return; }
    var result = createCategory(parentId, name);
    if (result.error) {
      state.inlineAddError = result.error;
      state.inlineAddDraft = name;
      renderTree();
      focusInlineAdd();
      return;
    }
    state.addingParentId = null;
    state.inlineAddError = null;
    state.inlineAddDraft = "";
    state.selectedId = result.node.id;
    render();
    focusRow(result.node.id);
  }

  function submitDetailAdd(parentId, rawName) {
    var name = rawName.trim();
    if (!name) return;
    var result = createCategory(parentId, name);
    if (result.error) {
      state.detailAddError = result.error;
      state.detailAddDraft = name;
      renderDetail();
      focusDetailAdd();
      return;
    }
    state.detailAddError = null;
    state.detailAddDraft = "";
    render();
    focusDetailAdd(); // stay in the field so several siblings can be added in a row
  }

  function submitRename(id, rawName) {
    var name = rawName.trim();
    var node = byId[id];
    if (!name) { state.renamingId = null; renderDetail(); return; }
    if (nameCollides(name, siblingsOf(id), id)) {
      state.renameError = '"' + name + '" is already used by a sibling category.';
      renderDetail();
      return;
    }
    node.name = name;
    node.updatedAt = "Today";
    state.renamingId = null;
    state.renameError = null;
    render();
  }

  function slugify(name, siblings) {
    var base = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "category";
    var id = base, i = 2;
    while (byId[id]) { id = base + "-" + i++; }
    return id;
  }

  function focusInlineAdd() {
    requestAnimationFrame(function () {
      var el = document.getElementById("inlineAddInput");
      if (el) {
        el.focus();
        el.select();
        el.scrollIntoView({ block: "nearest" });
      }
    });
  }

  function focusDetailAdd() {
    requestAnimationFrame(function () {
      var el = document.getElementById("detailAddInput");
      if (el) { el.focus(); el.select(); }
    });
  }

  function focusRow(id) {
    requestAnimationFrame(function () {
      var r = treeEl.querySelector('.row[data-id="' + id + '"]');
      if (r) r.focus();
    });
  }

  // ---- event wiring ----
  treeEl.addEventListener("click", function (e) {
    var addBtn = e.target.closest(".add-btn");
    var chevronBtn = e.target.closest(".chevron-slot[data-action='toggle']");
    var row = e.target.closest(".row");

    if (addBtn) {
      e.stopPropagation();
      if (addBtn.disabled) return;
      var id = addBtn.getAttribute("data-id");
      state.expanded.add(id);
      state.addingParentId = state.addingParentId === id ? null : id;
      state.inlineAddError = null;
      state.inlineAddDraft = "";
      renderTree();
      if (state.addingParentId === id) focusInlineAdd();
      return;
    }
    if (chevronBtn) {
      e.stopPropagation();
      var cid = chevronBtn.getAttribute("data-id");
      if (state.expanded.has(cid)) state.expanded.delete(cid); else state.expanded.add(cid);
      renderTree();
      return;
    }
    if (row) {
      selectNode(row.getAttribute("data-id"));
    }
  });

  treeEl.addEventListener("keydown", function (e) {
    var inlineInput = e.target.closest("#inlineAddInput");
    if (inlineInput) {
      if (e.key === "Enter") submitInlineAdd(inlineInput.getAttribute("data-parent"), inlineInput.value);
      if (e.key === "Escape") cancelInlineAdd();
      return;
    }
    var row = e.target.closest(".row");
    // Only handle keys pressed on the row itself; Enter/Space on the chevron or + button must still click them.
    if (!row || e.target !== row) return;
    var id = row.getAttribute("data-id");
    var rows = Array.prototype.slice.call(treeEl.querySelectorAll(".row"));
    var idx = rows.indexOf(row);

    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      selectNode(id);
      focusRow(id);
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      if (rows[idx + 1]) rows[idx + 1].focus();
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (rows[idx - 1]) rows[idx - 1].focus();
    } else if (e.key === "ArrowRight") {
      e.preventDefault();
      var hc = row.getAttribute("data-has-children") === "true";
      if (hc && state.expanded.has(id) === false) {
        state.expanded.add(id);
        renderTree();
        requestAnimationFrame(function () {
          var r = treeEl.querySelector('.row[data-id="' + id + '"]');
          if (r) r.focus();
        });
      } else if (hc && rows[idx + 1]) {
        rows[idx + 1].focus();
      }
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      var expanded = state.expanded.has(id);
      if (expanded) {
        state.expanded.delete(id);
        renderTree();
        requestAnimationFrame(function () {
          var r = treeEl.querySelector('.row[data-id="' + id + '"]');
          if (r) r.focus();
        });
      } else if (parentOf[id]) {
        var pid = parentOf[id];
        requestAnimationFrame(function () {
          var r = treeEl.querySelector('.row[data-id="' + pid + '"]');
          if (r) r.focus();
        });
      }
    }
  });

  treeEl.addEventListener("input", function (e) {
    if (e.target.id !== "inlineAddInput") return;
    state.inlineAddDraft = e.target.value;
    if (state.inlineAddError) {
      state.inlineAddError = null;
      var er = document.getElementById("inlineAddError");
      if (er) er.style.display = "none";
    }
  });

  document.getElementById("addRootBtn").addEventListener("click", startRootAdd);

  function selectNode(id) {
    state.selectedId = id;
    state.renamingId = null;
    state.confirmDeactivateId = null;
    state.addingParentId = null;
    state.inlineAddError = null;
    state.inlineAddDraft = "";
    state.detailAddError = null;
    state.detailAddDraft = "";
    render();
  }

  detailEl.addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    var action = btn.getAttribute("data-action");
    if (action === "add-root") { startRootAdd(); return; }
    var n = byId[state.selectedId];
    if (!n) return;

    if (action === "back") { state.selectedId = null; render(); }
    else if (action === "rename") { state.renamingId = n.id; state.renameError = null; renderDetail(); }
    else if (action === "toggle-trackable") { n.trackable = !n.trackable; n.updatedAt = "Today"; renderDetail(); }
    else if (action === "detail-add") {
      var input = document.getElementById("detailAddInput");
      submitDetailAdd(n.id, input.value);
    }
    else if (action === "deactivate") {
      var stats = activeDescendantStats(n);
      if (stats.cats > 0 || stats.items > 0) {
        state.confirmDeactivateId = n.id;
        renderDetail();
      } else {
        n.status = "inactive";
        n.updatedAt = "Today";
        render();
      }
    }
    else if (action === "confirm-deactivate") {
      n.status = "inactive";
      n.updatedAt = "Today";
      state.confirmDeactivateId = null;
      render();
    }
    else if (action === "cancel-deactivate") { state.confirmDeactivateId = null; renderDetail(); }
    else if (action === "reactivate") { n.status = "active"; n.updatedAt = "Today"; render(); }
  });

  searchEl.addEventListener("input", function () {
    state.query = searchEl.value;
    state.addingParentId = null;
    state.inlineAddError = null;
    state.inlineAddDraft = "";
    renderTree();
  });

  render();
})();
</script>
</body>
</html>
