server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS is Caddy's job. These are the headers that make sense on the origin regardless.
    # Every location below that sets its own add_header must re-include this file — see the
    # comment in it for why.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames are content-addressed, so they can be cached forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers pointing at asset
    # hashes that no longer exist.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Client-side routing: an unknown path is a React route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
