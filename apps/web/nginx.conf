server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS and the security headers that depend on it are Caddy's job; these are the ones
    # that make sense on the origin regardless.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # The SPA holds its tokens in localStorage, so a single injected script would read them.
    # helmet() on the API does not cover the HTML nginx serves — this is the compensating
    # control for that choice. 'unsafe-inline' for styles only, because Vite inlines a small
    # critical-CSS block; scripts stay strict.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames are content-addressed, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves browsers pointing at asset
    # hashes that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: an unknown path is a React route, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
