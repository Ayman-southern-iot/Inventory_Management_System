# Included into the server block AND into every location that declares its own `add_header`.
#
# nginx does not merge `add_header` across levels: a single `add_header` inside a location
# discards every header inherited from the server block. Because both `/assets/` and
# `= /index.html` set their own Cache-Control, the security headers silently vanished from
# exactly the responses that carry the application. Hence one file, included everywhere.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;

# The SPA holds its tokens in localStorage, so a single injected script would read them.
# helmet() on the API never sees this HTML, so this is the compensating control for that
# choice. 'unsafe-inline' is allowed for styles only; scripts stay strict.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
